name: attendtrack
description: "Attendance Track - Smart 75% Attendance for B.Tech & Degree Students"
publish_to: 'none'
version: 1.5.0+6

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  file_picker: ^8.1.2
  google_sign_in: ^6.2.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "app_logo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#3B82F6"
  adaptive_icon_foreground: "app_logo.jpg"

flutter:
  uses-material-design: true
