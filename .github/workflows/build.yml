name: Build AttendTrack APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files
        run: |
          flutter create --org com.madhav.attendtrack --project-name attendtrack .

      - name: Move Root google-services.json & Set Android SDK versions
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          else
            echo "WARNING: google-services.json not found in root!"
          fi
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true

      - name: Force compileSdk 36 for all Android modules
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compile-sdk.gradle <<'EOF'
          allprojects {
            afterEvaluate { project ->
              if (project.hasProperty('android')) {
                project.android.compileSdkVersion 36
              }
            }
          }
          EOF

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Custom App Logo Icon
        run: |
          if [ -f "app_logo.jpg" ]; then
            dart run flutter_launcher_icons || echo "WARNING: icon generation failed, using default icon"
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Play Store AAB Bundle
        run: flutter build appbundle --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendTrack-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendTrack-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
