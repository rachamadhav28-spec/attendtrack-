      - name: Move Root google-services.json & Set Android SDK versions
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          else
            echo "WARNING: google-services.json not found in root!"
          fi

sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true

- name: Force compileSdk 36 for all Android modules
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compile-sdk.gradle <<'EOF'
          allprojects {
            afterEvaluate { project ->
              if (project.hasProperty('android')) {
                project.android.compileSdkVersion 36
              }
            }
          }
          EOF

- name: Install Flutter Dependencies
        run: flutter pub get

- name: Generate Custom App Logo Icon
        run: |
          if [ -f "app_logo.jpg" ]; then
            dart run flutter_launcher_icons
          fi

- name: Build Release APK
        run: flutter build apk --release

- name: Build Play Store AAB Bundle
        run: flutter build appbundle --release
