name: Build AttendTrack APK & Play Store AAB (With Root Firebase)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files
        run: |
          flutter create --org com.madhav.attendtrack --project-name attendtrack .

      - name: Move Root google-services.json into android/app/
        run: |
          if [ -f "google-services.json" ]; then
            echo "Found google-services.json in root! Copying to android/app/..."
            cp google-services.json android/app/google-services.json
          else
            echo "WARNING: google-services.json not found in root!"
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Custom App Logo Icon (from root app_logo.jpg)
        run: |
          if [ -f "app_logo.jpg" ]; then
            dart run flutter_launcher_icons
          fi

      - name: Build Release APK (For Testing on Phone)
        run: flutter build apk --release

      - name: Build Play Store AAB Bundle
        run: flutter build appbundle --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendTrack-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendTrack-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
