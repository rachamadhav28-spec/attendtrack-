name: Build AttendTrack APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files
        run: |
          flutter create --org com.madhav --project-name attendtrack .

      - name: Move Root google-services.json & Set Android SDK versions
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          else
            echo "WARNING: google-services.json not found in root!"
          fi
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -e 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' -e 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$f"
          done
          true

      - name: Android permissions, Firebase plugin and signing key
        run: |
          # Same signing key every build so Google Sign-In SHA-1 stays valid
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi
          python3 - <<'PY'
          import glob, re
          # 1) Camera + internet permissions (flutter create leaves them out of release)
          m = 'android/app/src/main/AndroidManifest.xml'
          t = open(m).read()
          perms = ('<uses-permission android:name="android.permission.INTERNET"/>\n'
                   '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
                   '    <uses-permission android:name="android.permission.CAMERA"/>\n'
                   '    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n'
                   '    <application')
          if 'android.permission.CAMERA' not in t:
              t = t.replace('<application', perms, 1)
          t = re.sub(r'android:label="[^"]*"', 'android:label="AttendTrack"', t, count=1)
          open(m, 'w').write(t)
          # 2) Apply the Google services (Firebase) Gradle plugin
          for f in glob.glob('android/settings.gradle*'):
              t = open(f).read()
              if 'google-services' not in t:
                  t = re.sub(r'(^[^\n]*com\.android\.application[^\n]*$)',
                             r'\1\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                             t, count=1, flags=re.M)
                  open(f, 'w').write(t)
          for f in glob.glob('android/app/build.gradle*'):
              t = open(f).read()
              if 'google-services' not in t:
                  t = re.sub(r'(^[^\n]*com\.android\.application[^\n]*$)',
                             r'\1\n    id("com.google.gms.google-services")',
                             t, count=1, flags=re.M)
                  open(f, 'w').write(t)
          PY
          grep -n "google-services" android/settings.gradle* android/app/build.gradle*
          grep -n "permission" android/app/src/main/AndroidManifest.xml

      - name: Force compileSdk 36 for all Android modules
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compile-sdk.gradle <<'EOF'
          allprojects {
            afterEvaluate { project ->
              if (project.hasProperty('android')) {
                project.android.compileSdkVersion 36
              }
            }
          }
          EOF

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Custom App Logo Icon
        run: |
          if [ -f "assets/icon/app_icon.png" ]; then
            dart run flutter_launcher_icons || echo "WARNING: icon generation failed, using default icon"
          fi

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Build Play Store AAB Bundle
        run: flutter build appbundle --release --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendTrack-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendTrack-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
